name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Schema and rendering tests
    # Public repository: pull requests stay on GitHub-hosted runners. A fork can
    # change this workflow file, so external-contributor approval is enforced in
    # the repository settings as well.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'nas-linux-fop' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run verification suite
        shell: bash
        run: ./verification/gradlew -p verification --no-daemon clean test
